<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Concept Field Lab — постоянный граф</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"></head>
<body class="permanent-workspace"><main><header><div><span class="eyebrow">CONCEPT FIELD LAB</span><h1>Один постоянный концептуальный граф</h1></div><div class="header-actions"><span id="save-status" role="status">Подключение…</span><button id="workspace-tools">Данные и история</button></div></header>
<nav class="work-nav" aria-label="Рабочие области"><button id="go-builder">К конструктору</button><button id="go-graph">К постоянному графу</button><span id="global-count"></span></nav><div id="transition-notice" role="status" hidden></div>
<div class="work-columns"><section id="builder" aria-label="Конструктор определений"></section><section id="permanent-panel" aria-label="Постоянный граф"><h2>Постоянный граф</h2><input id="graph-search" type="search" placeholder="Обозначение или ID" aria-label="Поиск постоянного графа"><div id="graph-results"></div><div class="actions"><label>Показ<select id="graph-mode"><option value="all">Общий граф</option><option value="neighbourhood">Окружение выбранного</option></select></label><label>Глубина<input id="graph-depth" type="number" min="0" max="10" value="1"></label><button id="graph-fit">Вписать</button><label class="checkbox"><input id="graph-ids" type="checkbox">ID</label></div><div id="permanent-graph" class="graph" aria-label="Общий концептуальный граф"></div><p id="graph-caption"></p><div id="graph-inspector"></div></section></div><footer>Ручной ввод · единое пространство ID · без автоматического выбора смысла</footer></main><dialog id="dialog"><div id="dialog-body"></div></dialog><div id="toast" role="alert" hidden></div><script src="/graph-view.js"></script><script src="/builder.js"></script><script src="/workspace.js"></script></body></html>
