<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Concept Field Lab — постоянный граф</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"></head>
<body class="permanent-workspace"><main><header class="workspace-header"><h1>Concept Field Lab</h1><nav class="work-nav" aria-label="Рабочие области"><button id="go-thoughts" aria-controls="thoughts-panel" aria-pressed="false">Разбор фразы</button><button id="go-builder" aria-controls="builder" aria-pressed="true">Конструктор определений</button><button id="go-graph" aria-controls="permanent-panel" aria-pressed="false">Постоянный граф</button><button id="go-scenes" aria-controls="scenes-panel" aria-pressed="false">Сцены и рабочая область</button></nav><div class="header-actions"><span id="save-status" role="status">Подключение…</span><button id="workspace-tools">Данные и история</button></div></header>
<section id="thoughts-panel" hidden aria-label="Интерактивный разбор фразы"></section><section id="scenes-panel" hidden aria-label="Сцены и динамическая рабочая область"></section><div class="work-columns"><section id="builder" aria-label="Конструктор определений"></section><section id="permanent-panel" aria-label="Постоянный граф" hidden><div class="graph-heading"><h2>Постоянный граф</h2><span id="global-count"></span></div><div class="graph-controls"><input id="graph-search" type="search" placeholder="Обозначение или ID" aria-label="Поиск постоянного графа"><label>Показ<select id="graph-mode"><option value="all">Общий граф</option><option value="neighbourhood">Окружение выбранного</option></select></label><label>Глубина<input id="graph-depth" type="number" min="0" max="10" value="1"></label><label>Подписи<select id="graph-label-mode"><option value="auto">Автоматически</option><option value="always">Всегда</option><option value="hidden">Скрыты</option></select></label><button id="graph-editor">Редактировать граф…</button><button id="graph-region">Область → миниграф</button><button id="graph-layout">Раскладка</button><button id="graph-layout-apply" hidden>Применить…</button><button id="graph-layout-cancel" hidden>Отменить предпросмотр</button><button id="graph-layout-undo">Вернуть раскладку…</button><span id="graph-layout-status" role="status"></span><button id="graph-fit">Вписать</button><button id="graph-actions" aria-haspopup="menu">Действия ▾</button><label class="checkbox"><input id="graph-ids" type="checkbox">ID</label></div><div id="graph-results"></div><div id="permanent-graph" class="graph" aria-label="Общий концептуальный граф"></div><p id="graph-caption"></p></section></div><footer>Ручной ввод · единое пространство ID · без автоматического выбора смысла</footer></main><dialog id="dialog"><div id="dialog-body"></div></dialog><div id="toast" role="alert" hidden></div><script src="/graph-view.js"></script><script src="/canvas-menu.js"></script><script src="/alpha-captions.js"></script><script src="/builder.js"></script><script src="/canvas-builder.js"></script><script src="/overview-geometry.js"></script><script src="/permanent-layout.js"></script><script src="/scenes.js"></script><script src="/thoughts.js"></script><script src="/workspace.js"></script><script src="/graph-editor.js"></script></body></html>
